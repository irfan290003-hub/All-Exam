<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Brand Title -->
    <title>%%TITLE%%</title>
    
    <!-- Vector Favicon (Sharp on any resolution, light or dark browser theme) -->
    <link rel="icon" type="image/png" href="/logo.png" />
    
    <!-- Web App Manifest (PWA integration) -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F172A" />

    <!-- SEO Metadata -->
    <meta name="description" content="%%DESCRIPTION%%" />
    <meta name="keywords" content="ALL EXAM, Sarkari Result, Sarkari Exam, Latest Jobs, Admit Card, Answer Key, Syllabus, Sarkari Yojana, Government Exams, Employment News, Free Job Alert" />
    <meta name="author" content="ALL EXAM" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%%URL%%" />
    <meta property="og:title" content="%%TITLE%%" />
    <meta property="og:description" content="Get instant, official updates for recruitment notifications, results pathways, syllabus guides, and welfare policies in real time." />
    <meta property="og:image" content="https://allexam.org/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="%%URL%%" />
    <meta name="twitter:title" content="%%TITLE%%" />
    <meta name="twitter:description" content="%%DESCRIPTION%%" />
    <meta name="twitter:image" content="https://allexam.org/og-image.png" />

    <!-- Structured Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "ALL EXAM",
        "alternateName": "ALL EXAM Sarkari Portal",
        "url": "https://allexam.org/",
        "logo": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cpath d='M32 4 L54 10 V32 C54 45.3 44.5 54.5 32 58 C19.5 54.5 10 45.3 10 32 V10 L32 4 Z' fill='%232563EB' stroke='%230F172A' stroke-width='2.5'/%3E%3C/svg%3E",
        "description": "India's premier online portal for Sarkari Exam notifications, results pathways, syllabus guides, and welfare schemes.",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "support@allexam.org",
          "contactType": "customer support"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
